# conquestdesigner.com — its own site file (never appended to wardbyward).
#
# Same rail as the WardByWard block: same origin box, same nginx, same proxy
# headers. Exact server_name wins over the default_server, so this host reaches
# the venue on :3500 while wardbyward keeps hitting merchant-api on :3000.
#
# The cert below is the WardByWard Cloudflare Origin cert. It does NOT name this
# domain, so the zone must run SSL/TLS mode "Full" (encrypted, not verified).
# To move to "Full (strict)": issue a free Origin CA cert for conquestdesigner.com
# in the Cloudflare dashboard and point these two lines at it. Nothing else changes.
#
# Nothing here invents a deploy protocol: deploy/deploy-conquest.sh writes it,
# nginx -t gates it, `nginx -s reload` applies it.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name conquestdesigner.com www.conquestdesigner.com;

    ssl_certificate /etc/ssl/certs/cloudflare_wardbyward.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare_wardbyward.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
